<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click Counter with Timer</title>
    <style>
      body {
        text-align: center;
        font-family: Arial, sans-serif;
        margin-top: 50px;
      }
      button {
        padding: 10px 20px;
        font-size: 20px;
        cursor: pointer;
      }
      p {
        font-size: 24px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Click Counter with Timer</h1>
    <button onclick="increaseCount()">Click Me!</button>
    <p>Clicks: <span id="count">0</span></p>
    <p id="timerText"></p>

    <script>
      let count = 0;
      const increaseCount = () => {
        count = count + 1;
        document.getElementById('count').textContent=count;
      };
    </script>
  </body>
</html>
